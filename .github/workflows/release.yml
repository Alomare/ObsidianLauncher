# A release: pushing a tag like v0.2.0 builds the installer (signed for the updater, with a .sig and
# latest.json) and the portable ZIP, and puts them in a draft release. Publishing the draft makes it the
# release the app's updater sees.
#
# Needs two repository secrets: TAURI_SIGNING_PRIVATE_KEY, the content of the updater key file
# (internal/release/obsidian-updater.key, never committed), and TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# the password that opens it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version in every file, and has its notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in app/package.json app/src-tauri/tauri.conf.json; do
            grep -q "\"version\": \"$v\"" "$f" || { echo "$f does not say $v"; exit 1; }
          done
          for f in app/src-tauri/Cargo.toml core/Cargo.toml; do
            grep -q "^version = \"$v\"" "$f" || { echo "$f does not say $v"; exit 1; }
          done
          [ -s "docs/releases/$v.md" ] || { echo "docs/releases/$v.md is missing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # Reads the cache that cache.yml keeps on main. A tag run's own save could never be read by a later
      # tag, so it doesn't save.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false

      - name: The Obsidian Kit
        run: python tools/starter_pack.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The LuaJIT 2.0 compiler
        shell: cmd
        run: tools\build-luajit.cmd

      - name: Loader tests
        shell: cmd
        run: tools\test-loader.cmd

      - name: Core and app tests
        run: cargo test

      - name: Install the app's packages
        working-directory: app
        run: npm ci

      - name: UI tests
        working-directory: app
        run: npm test

      - name: Draft release
        id: draft
        run: |
          # GitHub's "latest" link skips prereleases, and the updater reads through it, so only a tag
          # with a suffix (v1.1.0-beta.1) stays away from the updater.
          pre=false
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=true
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Obsidian ${GITHUB_REF_NAME#v}" \
            -F draft=true -F prerelease=$pre -F body=@"$notes" --jq .id)
          [ -n "$id" ] || { echo "no release id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # The action fills latest.json from releaseBody, never from the draft. The app shows the text on
          # GitHub, so editing the release counts, and this copy stands in when GitHub can't be read.
          { echo "notes<<NOTES_END"; cat "$notes"; echo; echo NOTES_END; } >> "$GITHUB_OUTPUT"

      - name: The installer, the signature and latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ steps.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ steps.draft.outputs.notes }}

      - name: The portable ZIP
        run: |
          python tools/portable.py
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/portable/*.zip
