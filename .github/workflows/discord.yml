# Posts a published release to the Discord updates channel as an embed: the version, a link to the release, and the
# release's highlights (tools/discord_release.py). Pre-releases are never posted.
#
# Needs the repository secret DISCORD_RELEASE_WEBHOOK (the channel's webhook URL). DISCORD_RELEASE_TEST is a second
# webhook for trying the post out: a run by hand from the Actions tab goes there unless "live" is picked. Without the
# secret the run says so and posts nothing. NEXUS_URL (a repository variable or secret), when set, adds a Nexus link.
name: Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post (for example v1.2.0)
        required: true
      target:
        description: Which webhook
        type: choice
        options: [test, live]
        default: test
  # Temporary, for a test from dev.
  push:
    branches: [dev]
    paths: [.github/workflows/discord.yml]

permissions:
  contents: read

jobs:
  discord:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.2.0' }}
          LIVE: ${{ github.event_name == 'release' || inputs.target == 'live' }}
          LIVE_HOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TEST_HOOK: ${{ secrets.DISCORD_RELEASE_TEST }}
          NEXUS_URL: ${{ vars.NEXUS_URL || secrets.NEXUS_URL }}
        run: |
          if [ "$LIVE" = true ]; then name=DISCORD_RELEASE_WEBHOOK; hook="$LIVE_HOOK"; else name=DISCORD_RELEASE_TEST; hook="$TEST_HOOK"; fi
          if [ -z "$hook" ]; then
            echo "::warning::The secret $name isn't set: nothing posted."
            exit 0
          fi
          echo "Posting $TAG to $name"
          DISCORD_WEBHOOK="$hook" python3 tools/discord_release.py "$TAG"
